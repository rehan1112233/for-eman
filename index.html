<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fff0f5" />
  <title>For Eman 🎀</title>
  <style>
    :root {
      --pink: #f6b8cf;
      --deep-pink: #d85d8b;
      --rose: #a83d68;
      --ink: #684653;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow: hidden;
      display: grid; place-items: center; padding: 20px;
      color: var(--ink); font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      background: linear-gradient(145deg, #fff8fb, #ffeaf2 50%, #f7edff);
    }
    .floaties { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .floaty {
      position: absolute; bottom: -50px; opacity: 0;
      left: var(--left); font-size: var(--size);
      animation: float-up var(--duration) linear forwards;
    }
    .card {
      position: relative; z-index: 1; width: min(100%, 560px);
      text-align: center; padding: clamp(28px, 7vw, 54px) 22px;
      background: rgba(255,250,252,.9); border: 1px solid #f0c2d3;
      border-radius: 30px; box-shadow: 0 20px 65px rgba(180,95,130,.17);
      animation: appear .7s ease both;
    }
    .bow { font-size: 70px; line-height: 1.2; animation: bob 3s ease-in-out infinite; }
    h1 {
      margin: 16px 0 30px; color: var(--rose);
      font: 700 clamp(34px, 8vw, 54px)/1.15 Georgia, serif;
      letter-spacing: .035em;
    }
    .question {
      margin: 0 auto 25px; color: var(--ink);
      font: 500 clamp(22px, 5vw, 31px)/1.35 Georgia, serif;
    }
    button {
      border: 0; border-radius: 999px; cursor: pointer;
      font: 800 19px "Trebuchet MS", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .yes {
      color: white; background: linear-gradient(135deg, #e986ad, #d85d8b);
      padding: 16px 48px; min-width: 170px;
      box-shadow: 0 8px 0 #bd4e7b, 0 14px 25px #d85d8b45;
      transition: transform .18s ease;
    }
    .yes:hover { transform: translateY(-3px) scale(1.04); }
    .yes:active { transform: translateY(4px); box-shadow: 0 3px 0 #bd4e7b; }
    .hidden { display: none; }
    .big-heart { font-size: clamp(64px, 15vw, 96px); animation: heartbeat 1s ease-in-out infinite; }
    h2 { color: var(--rose); font: 700 clamp(34px, 8vw, 52px) Georgia, serif; margin: 16px 0; }
    .final-text { font-size: 19px; line-height: 1.6; }
    .sparkle { position: fixed; z-index: 5; pointer-events: none; animation: burst 900ms ease-out forwards; }
    @keyframes appear { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
    @keyframes heartbeat { 0%,100% { transform: scale(1); } 15%,45% { transform: scale(1.1); } 30%,60% { transform: scale(1); } }
    @keyframes float-up { 0% { transform: translateY(0) rotate(0); opacity: 0; } 10% { opacity: .8; } 100% { transform: translateY(-115vh) rotate(30deg); opacity: 0; } }
    @keyframes burst { from { transform: translate(0,0) scale(.4); opacity: 1; } to { transform: translate(var(--dx),var(--dy)) scale(1.4) rotate(35deg); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="floaties" id="floaties" aria-hidden="true"></div>
  <main class="card" id="card">
    <div class="bow" aria-hidden="true">🎀</div>
    <h1>I LOVE YOU EMAN 💗</h1>
    <p class="question">Will you beat my ass as a reward? 🥹</p>
    <button class="yes" id="yesButton" type="button">YES 💗</button>
  </main>

  <script>
    const floaties = document.getElementById("floaties");
    const card = document.getElementById("card");
    const yesButton = document.getElementById("yesButton");
    const symbols = ["♡", "♥", "୨୧", "✧", "🎀", "💗"];
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    function addFloaty() {
      if (reduceMotion || floaties.childElementCount > 30) return;
      const el = document.createElement("span");
      el.className = "floaty";
      el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
      el.style.setProperty("--left", Math.random() * 100 + "%");
      el.style.setProperty("--size", (16 + Math.random() * 20) + "px");
      el.style.setProperty("--duration", (6 + Math.random() * 5) + "s");
      floaties.appendChild(el);
      el.addEventListener("animationend", () => el.remove(), { once: true });
    }
    if (!reduceMotion) {
      for (let i = 0; i < 12; i++) setTimeout(addFloaty, i * 180);
      setInterval(addFloaty, 700);
    }

    yesButton.addEventListener("click", () => {
      if (!reduceMotion) {
        const r = yesButton.getBoundingClientRect();
        for (let i = 0; i < 28; i++) {
          const el = document.createElement("span");
          el.className = "sparkle";
          el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
          el.style.left = (r.left + r.width / 2) + "px";
          el.style.top = (r.top + r.height / 2) + "px";
          el.style.fontSize = (16 + Math.random() * 18) + "px";
          el.style.setProperty("--dx", (Math.random() - .5) * innerWidth * .8 + "px");
          el.style.setProperty("--dy", (Math.random() - .7) * innerHeight * .8 + "px");
          document.body.appendChild(el);
          el.addEventListener("animationend", () => el.remove(), { once: true });
        }
      }
      card.innerHTML = '<div class="bow" aria-hidden="true">🎀</div><div class="big-heart" aria-hidden="true">💖</div><h2>YAY EMAN!!</h2><p class="final-text">I LOVE YOUUU 💗🎀</p>';
    });
  </script>
</body>
</html>
